[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-analytics-dashboard"
version = "2.0.0"
description = "Reproducible Plotly Dash project analytics demonstration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dash>=3.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=6.0,<7",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
construction-dashboard = "dashboard_app.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
monica = [
  "aiohttp>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "markdown>=3.6,<4",
  "networkx>=3.2,<4",
  "pdfplumber>=0.11,<1",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["dashboard_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "Knowledge-Base",
  "AI_Dashboard_Implementation",
  "AI_Knowledge_Extraction_System",
  "Monica_AI_System",
  "docs/archive",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"dashboard_app/exporter.py" = ["E501"]
